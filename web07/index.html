<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>多媒體播放</h1>
    <h2>音樂播放</h2>
    <!-- 支援.wav, wma, mp3(串流) -->
    <audio src="media/audio.mp3" autoplay="true" controls style="width: 500px;"></audio>
    <h2>影片播放</h2>
    <!-- 支援.mp4, webm, .ogg -->
    <video src="media/video.mp4" controls style="width: 300px; height: 300px;"></video>
    <h2>流量</h2>
    <p>伺服器串流影片時，會佔用較多頻寬，建議使用嵌入的影片</p>
    <p>架設網站主要需要固定IP位址</p>
    <p>假設影片是190mb(1080p) 4M/4M的上傳時間為190/4=47.5秒</p>
    <h2>嵌入影片</h2>
    <iframe width="935" height="534" src="https://www.youtube.com/embed/PM5V3P_iDAk?list=PL_k9bFPONrNfrmOXvxU3FijljSFUCc-Rm" title="背景音樂 無版權音樂 免費音樂 BGM音樂下載 歌名: Moving On  作者: Wayne Jones | 鄉村與民謠 | 平靜音樂" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <h2>嵌入podcast</h2>
    <iframe width="503" height="283" src="https://www.youtube.com/embed/FkeY1xxGcWk" title="推倒資本主義的高牆：免費教你如何做Podcast 序" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
